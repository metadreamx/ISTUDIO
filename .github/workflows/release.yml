name: Build ISTUDIO Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows release package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build release package
        shell: pwsh
        run: .\scripts\package-release.ps1 -Repo "${{ github.repository }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISTUDIO-windows-release
          path: |
            release/ISTUDIO-windows.zip
            release/LAUNCH ISTUDIO.bat
            release/ISTUDIO.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release/ISTUDIO-windows.zip "release/LAUNCH ISTUDIO.bat" release/ISTUDIO.exe --clobber
          } else {
            gh release create $tag release/ISTUDIO-windows.zip "release/LAUNCH ISTUDIO.bat" release/ISTUDIO.exe --title "ISTUDIO $tag" --notes "Windows launcher and self-contained update package for ISTUDIO."
          }
