name: Build ISTUDIO Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows release package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build release package
        shell: pwsh
        run: .\scripts\package-release.ps1 -Repo "${{ github.repository }}" -ReleaseTag "${{ github.ref_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISTUDIO-windows-release
          path: |
            release/INSTALL-ISTUDIO.bat

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release/INSTALL-ISTUDIO.bat --clobber
          } else {
            gh release create $tag release/INSTALL-ISTUDIO.bat --title "ISTUDIO $tag" --notes "Download INSTALL-ISTUDIO.bat, place it where you want ISTUDIO installed, then double-click it."
          }

          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          foreach ($release in $releases) {
            foreach ($asset in $release.assets) {
              if ($asset.name -ne "INSTALL-ISTUDIO.bat") {
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$($asset.id)" *> $null
              }
            }
          }
